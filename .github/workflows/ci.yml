name: Python checks
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: OpenCV native runtime on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m pytest
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/showcase-runtime.test.cjs
      - run: python tools/build_showcase.py
      - run: python -m build
      - name: Verify installed wheel outside checkout
        shell: bash
        run: |
          python -m pip uninstall -y spyder-cctv
          python -m pip install dist/*.whl
          cp -r tests "$RUNNER_TEMP/spyder-tests"
          cd "$RUNNER_TEMP"
          spyder-cctv --version
          spyder-cctv --config "$RUNNER_TEMP/spyder-config.json" init
          spyder-cctv --config "$RUNNER_TEMP/spyder-config.json" check
          python -m pytest spyder-tests
