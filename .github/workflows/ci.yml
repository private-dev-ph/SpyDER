name: Python checks
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m pytest
      - run: python -m build
      - name: Verify installed wheel outside checkout
        shell: bash
        run: |
          python -m pip uninstall -y spyder-cctv
          python -m pip install dist/*.whl
          cp -r tests "$RUNNER_TEMP/spyder-tests"
          cd "$RUNNER_TEMP"
          spyder-cctv --version
          spyder-cctv --config "$RUNNER_TEMP/spyder-config.json" init
          spyder-cctv --config "$RUNNER_TEMP/spyder-config.json" check
          python -m pytest spyder-tests
