[build-system]
requires = ["setuptools>=77,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "spyder-cctv"
version = "0.8.0"
description = "Local multi-camera monitoring with pluggable computer vision"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["opencv-python>=4.10,<5", "platformdirs>=4,<5"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "build>=1.2,<2"]
yolo = ["ultralytics>=8.4,<9"]
insightface = ["insightface>=2.1,<2.2", "onnxruntime>=1.18,<2"]

[project.scripts]
spyder-cctv = "spyder_cctv.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
spyder_cctv = ["assets/*.html", "assets/*.json", "assets/*.js", "assets/*.css", "assets/*.svg", "assets/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
